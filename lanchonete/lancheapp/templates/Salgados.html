{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salgados</title>
    <link rel="stylesheet" href="{% static 'css/css.css' %}">
    <script src="{% static 'js/script.js' %}" type="text/javascript"></script>
</head>
<body>

    <header>
        <div class="listaHeader"><ul>
            <li><a href="{% url 'Bebidas' %}">bebidas</a></li>
            <li><a href="{% url 'Salgados' %}">salgados</a></li>
            <li><a href="{% url 'Sanduiches'%}">sanduíches</a></li>
        </ul></div>
    </header>

    <div class="logo">

        <a href="{% static 'imagens/lanches.png'%}" id="logo">
            <img src="{% static 'imagens/lanches.png'%}" width="10%" height="10%">
        </a>

        <a>
            <h2 id="logotexto"> Lá ele LANCHES </h2>
        </a>

    </div>

    <div class="pedidos">
        <br>
        <h2>Salgados</h2>
    {% for Salgados in Salgados %} <!-- Para {variavel local} em {array do banco} -->
    {% if Salgados.categoria == "2" %}
        <a class="listaPedido" href="{% url 'Pedido' Salgados.id %}">{{Salgados.nome}} </a> <i>R${{Salgados.preco}}</i> <!-- url {name do caminho no lancheapp/urls.py} {valor referente ao query do banco}.id <- remete ao id para pegar um valor único -->
    </div>
    <div>

    {% if Salgados.imagem %}

    <img src="{{Salgados.imagem.url}}" alt="" id="imagemPedido">

    {% endif %}
    {% endif %}

    <br>
    {% endfor %}
    
    </div>
    <a href="{% url 'index' %}"><button>voltar</button></a>
</body>
